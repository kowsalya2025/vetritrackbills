<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Set Up Your Finances - Vetri PinTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/onboarding.css">
</head>
<body>
    <div class="onboarding-container">
        <header class="onboarding-header">
            <div class="logo">
                <img src="/static/images/vetrilogo.png" alt="Vetri PinTrack logo">
            </div>
        </header>

        <main class="onboarding-main">
            <h1 class="onboarding-title">Let's Set Up Your Finances ⭐</h1>
            <p class="onboarding-subtitle">Let's Set Up Your Finances</p>

            <div class="onboarding-card">
                <h2 class="card-title">Connect your first bill</h2>

                <form method="post">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Bill Name*</label>
                            <select name="bill_name" required>
                                <option value="electricity">Electricity Bill(TNEB)</option>
                                <option value="water">Water Bill</option>
                                <option value="internet">Internet Bill</option>
                                <option value="mobile">Mobile Recharge</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Bill ID / Consumer Number*</label>
                            <input type="text" name="consumer_id" placeholder="Enter Customer ID" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Account Holder Name</label>
                            <input type="text" name="account_holder" placeholder="₹ 0">
                        </div>
                        <div class="form-group">
                            <label>Last Rechanger</label>
                            <input type="text" name="last_recharge" placeholder="₹ 0">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Due Date</label>
                            <input type="text" name="due_date" placeholder="₹ 0">
                        </div>
                        <div class="form-group">
                            <label>Amount</label>
                            <input type="text" name="amount" placeholder="₹ 0">
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-back" onclick="window.location.href='{% url 'onboarding_step5' %}'">Back</button>
                        <button type="submit" class="btn-continue">Finish</button>
                    </div>
                </form>
            </div>
        </main>

        <footer class="onboarding-footer">
            <p class="copyright">&copy; 2026 Vetri PinTrack. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms</a>
                <a href="#">Help Center</a>
                <a href="#">Contact</a>
            </div>
        </footer>
    </div>
</body>
</html>
