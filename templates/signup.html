<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Vetri PinTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="left-section">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Sign up to get started</p>

                <form class="auth-form" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Enter Name*</label>
                        <input type="text" name="name" placeholder="Enter Name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" placeholder="Enter Phone Number">
                    </div>
                    <div class="form-group">
                        <label>Email Id*</label>
                        <input type="email" name="email" placeholder="Enter Email Address" required>
                    </div>
                    <div class="form-group">
                        <label>Password*</label>
                        <div class="password-input">
                            <input type="password" name="password" placeholder="Create Password" required>
                            <i class="fas fa-eye-slash toggle-password"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-signup">Sign Up</button>
                </form>

                <p class="login-link">
                    Already have an account? <a href="{% url 'login' %}">Login</a>
                </p>

                <div class="divider">
                    <span>or</span>
                </div>

                <button class="btn-google">
                    <img src="/static/images/google-logo.png" alt="Google">
                    Continue With Google
                </button>

                <p class="terms-text">
                    By creating an account, you agree to our Terms and Privacy Policy.
                </p>
            </div>

            <div class="right-section">
                <div class="logo-top">
                    <img src="/static/images/vetrilogo.png" alt="Vetri PinTrack logo">
                </div>
                <div class="illustration">
                    <img src="/static/images/signup.png" alt="Finance Illustration">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
